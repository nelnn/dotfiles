onboarding = false

[keys]
prefix = "ctrl+b"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
# focus_pane_left = "ctrl+h"
# focus_pane_down = "ctrl+j"
# focus_pane_up = "ctrl+k"
# focus_pane_right = "ctrl+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"
switch_tab = "alt+1..9"
switch_workspace = "prefix+1..9"
# Replaces the default prefix+e edit-scrollback binding.
edit_scrollback = ""
toggle_sidebar = "prefix+e"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+f"
# A temporary pane hosts fzf and closes after the workspace is created.
type = "pane"
command = "/home/nsc/.local/bin/scripts/herdr-sessioniser"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"


# Vim navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
[ui]
tab_bar_position = "bottom"
pane_gaps = false

[theme]
name = "rose-pine"
auto_switch = false

[experimental]
kitty_graphics = true
