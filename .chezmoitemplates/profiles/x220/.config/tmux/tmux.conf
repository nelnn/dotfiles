# Allow mouse use
# set -g mouse on
set -g mouse off

# prefix-r is shortcut for: source-file ~/.config/tmux/tmux-session.conf.
# prefix-i is for installing plugins.

# Change the prefix
# unbind C-space
# set -g prefix C-b
# bind C-b send-prefix

# Neovim
# set -sg escape-time 10
# set-option -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Show Pi by name rather than its Node.js runtime.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{&&:#{==:#{pane_current_command},node},#{m:π - *,#{pane_title}}},pi,#{pane_current_command}}}#{?pane_dead,[dead],}'

# Yazi image preview
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off


# Native status bar with green text on the terminal background
set -g status-style 'fg=#76FF7A,bg=default'
set -g message-style 'fg=#2E8B57,bg=default'
set -g message-command-style 'fg=#2E8B57,bg=default'
set -g mode-style 'fg=black,bg=#2E8B57'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin '27medkamal/tmux-agent-wizard'
# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings

# These bindings make tmux's copy mode behave more like Vim, which can be very convenient if you're used to Vim keybindings. Here's how you might use this in practice:
# Enter copy mode (usually with your tmux prefix followed by '[')
# Navigate to the start of the text you want to copy
# Press 'v' to start selection (or 'C-v' for rectangle selection)
# Move to select the desired text
# Press 'y' to copy the selection and exit copy mode
# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use copy-pipe to send selected text to both tmux buffer and X11 PRIMARY selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection primary -in"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

## Switching windows: Modifier key is Left Option.
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key x kill-pane
bind-key -r f run-shell "tmux neww ~/.local/bin/scripts/tmux-sessioniser"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
