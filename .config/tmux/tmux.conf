# Allow mouse use
set -g mouse on

set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Yazi image preview
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off
set-option -g focus-events on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme '#3ba9db'
# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings
# prefix-i is for installing plugins.
bind r source-file ~/.dotfiles/tmux/tmux.conf                                                                                                ▐
bind-key x kill-pane
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessioniser"

# These bindings make tmux's copy mode behave more like Vim, which can be very
# convenient if you're used to Vim keybindings. Here's how you might use this
# in practice:
# Enter copy mode (usually with your tmux prefix followed by '[')
# Navigate to the start of the text you want to copy
# Press 'v' to start selection (or 'C-v' for rectangle selection)
# Move to select the desired text
# Press 'y' to copy the selection and exit copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

## Cmd+1–9 switches windows via Ghostty's Ctrl+B number mappings.
## Alt+numbers are reserved for Rift.

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
